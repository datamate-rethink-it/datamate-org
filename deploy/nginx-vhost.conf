# vhost fuer das nativ installierte nginx auf dem Server.
#
# Hier steht nur, was zum Server gehoert: TLS, der kanonische Hostname und
# die Weitergabe an den Container. Alles, was zur Seite gehoert - die
# Weiterleitungen, der Feed, try_files, 404, 410 - steckt im Image und ist
# dort mit dem Inhalt zusammen versioniert.
#
# Pfade zu den Zertifikaten an die bestehende Installation anpassen.
# Der Container hoert auf 127.0.0.1:8082 (ionas.com liegt auf 8081).

server {
    listen 80;
    listen [::]:80;
    server_name datamate.org www.datamate.org;
    return 301 https://www.datamate.org$request_uri;
}

# datamate.org leitete schon bisher auf www.datamate.org um (301).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name datamate.org;

    ssl_certificate     /etc/letsencrypt/live/datamate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datamate.org/privkey.pem;

    return 301 https://www.datamate.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.datamate.org;

    ssl_certificate     /etc/letsencrypt/live/datamate.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datamate.org/privkey.pem;

    access_log /var/log/nginx/datamate.org.access.log;
    error_log  /var/log/nginx/datamate.org.error.log;

    # Die Seite nimmt keine Uploads an.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Caddy komprimiert selbst; nginx soll das nicht nochmal anfassen.
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
